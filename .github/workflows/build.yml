name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Versionen fuer 26.2 ermitteln
        id: v
        run: |
          set -e
          meta() { curl -fsSL "$1/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed -e 's/<[^>]*>//g'; }
          PAPER=$(meta https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api | grep '^26\.2' | grep -viE 'snapshot|pre|rc' | tail -1 || true)
          if [ -z "$PAPER" ]; then PAPER=$(meta https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api | grep '^26\.2' | tail -1); fi
          LITE=$(meta https://masa.dy.fi/maven/sakura-ryoko/fi/dy/masa/litematica/litematica-fabric-26.2 | tail -1)
          MALI=$(meta https://masa.dy.fi/maven/sakura-ryoko/fi/dy/masa/malilib/malilib-fabric-26.2 | tail -1)
          echo "Paper API:  $PAPER"
          echo "Litematica: $LITE"
          echo "MaLiLib:    $MALI"
          echo "paper=$PAPER" >> "$GITHUB_OUTPUT"
          echo "lite=$LITE" >> "$GITHUB_OUTPUT"
          echo "mali=$MALI" >> "$GITHUB_OUTPUT"

      - name: Plugin bauen
        working-directory: plugin
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -PpaperVersion="${{ steps.v.outputs.paper }}" 2>&1 | tee ../plugin-build.log

      - name: Mod bauen
        working-directory: mod
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -Plitematica_version="${{ steps.v.outputs.lite }}" -Pmalilib_version="${{ steps.v.outputs.mali }}" 2>&1 | tee ../mod-build.log

      - name: Build-Logs in Branch ci-logs ablegen
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp -f *-build.log /tmp/logs/ 2>/dev/null || true
          echo "paper=${{ steps.v.outputs.paper }} lite=${{ steps.v.outputs.lite }} mali=${{ steps.v.outputs.mali }} sha=${{ github.sha }}" > /tmp/logs/info.txt
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Logs ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Dateien sammeln
        run: |
          mkdir -p dist
          cp plugin/build/libs/Lifematic-Plugin-*.jar dist/
          cp mod/build/libs/lifematic-*.jar dist/
          rm -f dist/*-sources.jar
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: lifematic
          path: dist/

      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lifematic (neuester Build)
          prerelease: true
          make_latest: false
          body: |
            Automatischer Build von ${{ github.sha }}
            Paper-API ${{ steps.v.outputs.paper }} · Litematica ${{ steps.v.outputs.lite }} · MaLiLib ${{ steps.v.outputs.mali }}

            Lifematic-Plugin-*.jar → in den plugins-Ordner des Servers
            lifematic-*.jar → in den mods-Ordner der Spieler (bringt Litematica, MaLiLib und Fabric API mit)
          files: dist/*.jar
